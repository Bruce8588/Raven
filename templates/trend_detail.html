<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趋势详情 - Raven</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        :root {
            --primary: #1a73e8;
            --up-color: #dc2626;
            --down-color: #16a34a;
            --up-break-color: #000000;
            --down-break-color: #f97316;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            text-decoration: none;
            color: var(--text);
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .stock-header {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .stock-header-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .stock-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stock-name { font-size: 24px; font-weight: 700; }

        .stock-meta {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
        }

        .stock-signals { display: flex; gap: 12px; align-items: center; }

        .signal-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: white;
        }

        .signal-badge.up { background: var(--up-color); }
        .signal-badge.down { background: var(--down-color); }
        .signal-badge.up-break { background: var(--up-break-color); color: white; }
        .signal-badge.down-break { background: var(--down-break-color); color: white; }
        .signal-badge.unknown { background: #9ca3af; color: white; }

        .stock-price-row {
            display: flex;
            gap: 24px;
            align-items: baseline;
        }

        .stock-price { font-size: 32px; font-weight: 700; }
        .stock-price.up { color: var(--up-color); }
        .stock-price.down { color: var(--down-color); }
        .stock-price.neutral { color: var(--text-secondary); }
        .stock-trend-name { font-size: 16px; color: var(--text-secondary); }

        /* ========== 配置信息区块 ========== */
        .config-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
        }

        .config-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 12px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        .config-label { font-size: 11px; color: var(--text-secondary); }
        .config-value { font-size: 14px; font-weight: 600; color: var(--text); }
        .config-value.up { color: var(--up-color); }
        .config-value.down { color: var(--down-color); }

        /* ========== 滑条 + 每分钟数据 ========== */
        .minute-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .slider-time-range { font-size: 12px; color: var(--text-secondary); }

        .time-slider {
            width: 100%;
            margin: 8px 0 16px;
            cursor: pointer;
            height: 6px;
            -webkit-appearance: none;
            background: #e5e7eb;
            border-radius: 3px;
            outline: none;
        }

        .time-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .minute-table-wrapper {
            max-height: 320px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .minute-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .minute-table thead th {
            position: sticky;
            top: 0;
            background: #374151;
            color: white;
            padding: 8px 10px;
            text-align: center;
            font-weight: 500;
            z-index: 1;
        }

        .minute-table thead th.th-time { text-align: left; min-width: 130px; }
        .minute-table thead th.th-num { min-width: 70px; }

        .minute-table tbody tr:hover { background: #f9fafb; }
        .minute-table tbody tr.tr-highlighted { background: #fef9c3 !important; }

        .minute-table td {
            padding: 6px 10px;
            text-align: center;
            border-bottom: 1px solid #f3f4f6;
        }

        .td-time { text-align: left !important; color: var(--text-secondary); font-size: 11px; }
        .td-price.up { color: var(--up-color); font-weight: 600; }
        .td-price.down { color: var(--down-color); font-weight: 600; }
        .td-price.neutral { color: var(--text-secondary); }

        /* ========== 十列趋势表格 ========== */
        .trends-section { margin-top: 20px; }

        .trends-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            overflow-x: auto;
        }

        .trend-column {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            min-width: 130px;
        }

        .trend-col-header {
            padding: 12px 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: white;
        }

        .trend-col-header.col-1, .trend-col-header.col-2,
        .trend-col-header.col-3, .trend-col-header.col-4 { background: var(--up-color); }
        .trend-col-header.col-5 { background: var(--up-break-color); color: white; }
        .trend-col-header.col-6, .trend-col-header.col-7,
        .trend-col-header.col-8, .trend-col-header.col-9 { background: var(--down-color); }
        .trend-col-header.col-10 { background: var(--down-break-color); }

        .trend-col-body {
            padding: 8px;
            max-height: 500px;
            overflow-y: auto;
        }

        .trend-record {
            padding: 8px 6px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #f9fafb;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
        }

        .trend-record:hover {
            background: #f0f4ff;
            transform: translateX(2px);
        }

        .trend-record.col-1, .trend-record.col-2,
        .trend-record.col-3, .trend-record.col-4 { border-left-color: var(--up-color); }
        .trend-record.col-5 { border-left-color: var(--up-break-color); }
        .trend-record.col-6, .trend-record.col-7,
        .trend-record.col-8, .trend-record.col-9 { border-left-color: var(--down-color); }
        .trend-record.col-10 { border-left-color: var(--down-break-color); }

        .record-time { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }
        .record-price { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
        .record-keypoints { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }
        .record-kp { display: flex; justify-content: space-between; }
        .record-kp-label { color: #9ca3af; }
        .record-kp-value { font-weight: 500; }

        .no-records {
            text-align: center;
            padding: 20px 8px;
            font-size: 12px;
            color: #d1d5db;
        }

        .trend-record.current-trend {
            background: #fef9c3;
            border: 1px solid #fde047;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon { font-size: 48px; margin-bottom: 16px; }

        /* 加载动画 */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            gap: 12px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            display: none;
        }

        /* 记录详情弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-title { font-size: 16px; font-weight: 600; }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            line-height: 1;
        }

        .modal-body { font-size: 13px; line-height: 1.8; }

        .modal-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .modal-row:last-child { border-bottom: none; }
        .modal-label { color: var(--text-secondary); }
        .modal-value { font-weight: 500; }

        /* 响应式 */
        @media (max-width: 900px) {
            .trends-grid { grid-template-columns: repeat(5, 1fr); }
            .config-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .trends-grid { grid-template-columns: repeat(3, 1fr); }
        }

        /* ========== 趋势交叉表格 ========== */
        .trends-table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .trends-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 800px;
        }

        .trends-table thead th {
            padding: 10px 8px;
            text-align: center;
            font-weight: 600;
            font-size: 12px;
            color: white;
            white-space: nowrap;
        }

        .trends-table thead th.th-time {
            background: #374151;
            min-width: 90px;
        }

        .th-trend.th-up { background: var(--up-color); }
        .th-trend.th-up-break { background: var(--up-break-color); }
        .th-trend.th-down { background: var(--down-color); }
        .th-trend.th-down-break { background: var(--down-break-color); }

        .trends-table tbody tr.tr-time-row:hover { background: #f9fafb; }
        .tr-time-row.tr-current { background: #fef9c3; }

        .trends-table td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid #f3f4f6;
            vertical-align: middle;
        }

        .td-time {
            background: #f8f9fa;
            font-weight: 500;
            min-width: 90px;
            text-align: left !important;
        }

        .cell-time { font-size: 12px; color: var(--text); }
        .cell-price { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

        .td-trend {
            cursor: pointer;
            transition: background 0.15s;
            min-width: 100px;
        }

        .td-trend:hover { background: #f0f4ff; }

        .td-trend.td-up { border-left: 3px solid var(--up-color); }
        .td-trend.td-up-break { border-left: 3px solid var(--up-break-color); }
        .td-trend.td-down { border-left: 3px solid var(--down-color); }
        .td-trend.td-down-break { border-left: 3px solid var(--down-break-color); }

        .td-trend.td-empty { background: #fafafa; cursor: default; }
        .td-trend.td-empty:hover { background: #fafafa; }

        .td-trend.cell-current {
            background: #fef9c3 !important;
            border: 1px solid #fde047;
        }

        .cell-kp-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 2px; }
        .cell-kp-value { font-size: 13px; font-weight: 600; color: var(--text); }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <a href="/" class="back-btn">← 返回</a>
                <span class="page-title">📊 趋势详情</span>
            </div>
        </header>

        <div class="stock-header" id="stockHeader">
            <div class="loading">
                <div class="spinner"></div>
                <span>加载中...</span>
            </div>
        </div>

        <!-- 配置信息区块 -->
        <div class="config-section" id="configSection" style="display:none;">
            <div class="section-title">⚙️ 配置信息</div>
            <div class="config-grid" id="configGrid"></div>
        </div>



        <!-- 滑条 + 每分钟数据区块 -->
        <div class="minute-section" id="minuteSection" style="display:none;">
            <div class="slider-header">
                <div class="section-title">
                    📈 每分钟数据
                    <span id="minuteCount" style="font-weight:400;font-size:12px;color:#9ca3af;"></span>
                </div>
                <div class="slider-time-range" id="sliderTimeRange"></div>
            </div>
            <input type="range" class="time-slider" id="timeSlider" min="0" max="100" value="100" />
            <div class="minute-table-wrapper" id="minuteTableWrapper">
                <table class="minute-table" id="minuteTable">
                    <thead>
                        <tr>
                            <th class="th-time">时间</th>
                            <th class="th-num">趋势</th>
                            <th class="th-num">趋势名称</th>
                            <th class="th-num">价格</th>
                            <th class="th-num">关键点</th>
                        </tr>
                    </thead>
                    <tbody id="minuteTableBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">记录详情</span>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    const TREND_COLUMNS = [
        { key: 'up',               label: '上升趋势',   color: 'up',         colClass: 'col-1', desc: '进行中的单向运动' },
        { key: 'up_natural',       label: '自然回撤',   color: 'up',         colClass: 'col-2', desc: '正常反弹' },
        { key: 'up_rally',         label: '回升',       color: 'up',         colClass: 'col-3', desc: '可能突破' },
        { key: 'up_secondary',     label: '次级回撤',   color: 'up',         colClass: 'col-4', desc: '无意义的运动' },
        { key: 'up_break',         label: '上升破碎',   color: 'up-break',   colClass: 'col-5', desc: '趋势可能反转' },
        { key: 'down',             label: '下跌趋势',   color: 'down',       colClass: 'col-6', desc: '进行中的单向运动' },
        { key: 'down_natural',     label: '自然回升',   color: 'down',       colClass: 'col-7', desc: '正常反弹' },
        { key: 'down_rally',       label: '回撤',       color: 'down',       colClass: 'col-8', desc: '可能突破' },
        { key: 'down_secondary',  label: '次级回升',   color: 'down',       colClass: 'col-9', desc: '无意义的运动' },
        { key: 'down_break',       label: '下跌破碎',  color: 'down-break', colClass: 'col-10', desc: '趋势可能反转' },
    ];

    const pathParts = window.location.pathname.split('/');
    const symbol = pathParts[pathParts.length - 1];

    let minuteRecords = [];
    let minuteTableBody = null;

    document.addEventListener('DOMContentLoaded', () => {
        minuteTableBody = document.getElementById('minuteTableBody');
        loadTrendDetail();
    });

    async function loadTrendDetail() {
        try {
            const resp = await fetch(`/api/trend_detail/${symbol}`);
            const data = await resp.json();

            // errorcode 非0，或者没有任何数据（records 和 minute_records 都为空）时显示空状态
            if (data.errorcode !== 0 || (data.total_records === 0 && data.minute_total === 0)) {
                renderEmpty(data.errmsg || '暂无趋势历史数据');
                return;
            }

            renderHeader(data);
            renderConfigInfo(data.config_info, data.current_trend_code);
            minuteRecords = data.records || [];  // 使用趋势历史记录作为分钟数据（含趋势信息）
            renderMinuteSection(minuteRecords);

        } catch (e) {
            renderEmpty('加载失败: ' + e.message);
        }
    }



    function renderHeader(data) {
        const header = document.getElementById('stockHeader');
        const trendCode = data.current_trend_code || '';
        const isUp = trendCode.startsWith('up');
        const isDown = trendCode.startsWith('down');
        const isUpBreak = trendCode === 'up_break';
        const isDownBreak = trendCode === 'down_break';

        const TREND_DESC = {
            'up': '进行中的单向运动',
            'up_natural': '正常反弹',
            'up_rally': '可能突破',
            'up_secondary': '无意义的运动',
            'up_break': '趋势可能反转',
            'down': '进行中的单向运动',
            'down_natural': '正常反弹',
            'down_rally': '可能突破',
            'down_secondary': '无意义的运动',
            'down_break': '趋势可能反转',
        };

        let signalClass = 'unknown';
        if (isUp && !isUpBreak) signalClass = 'up';
        else if (isDown && !isDownBreak) signalClass = 'down';
        else if (isUpBreak) signalClass = 'up-break';
        else if (isDownBreak) signalClass = 'down-break';

        const priceClass = isUp ? 'up' : isDown ? 'down' : 'neutral';

        header.innerHTML = `
            <div class="stock-header-main">
                <div class="stock-title">
                    <div class="stock-name">${data.name || symbol}</div>
                    <div class="stock-meta">
                        <span>${data.code || ''}</span>
                        <span>${data.market === 'SZ' ? '深圳' : data.market === 'SH' ? '上海' : ''}</span>
                        <span>${symbol}</span>
                    </div>
                </div>
                <div class="stock-signals">
                    <span class="signal-badge ${signalClass}">${data.signal_text || '待分析'}</span>
                    <span class="signal-badge ${signalClass}" style="opacity:0.7;">${data.current_trend_name || '暂无趋势'}</span>
                </div>
            </div>
            <div class="stock-price-row">
                <div class="stock-price ${priceClass}">
                    ${data.current_price > 0 ? '¥' + data.current_price.toFixed(2) : '--'}
                </div>
                <div class="stock-trend-name">
                    ${data.current_trend_name ? '当前趋势: ' + data.current_trend_name : ''}
                    ${TREND_DESC[trendCode] ? ' · ' + TREND_DESC[trendCode] : ''}
                </div>
            </div>
            <div style="margin-top:10px;font-size:12px;color:#9ca3af;">
                ${data.total_records > 0 ? '📈 ' + data.total_records + ' 条趋势记录' : ''}
            </div>
        `;
    }

    // 每种趋势需要展示的关键点
    const TREND_KEYPOINTS = {
        'up': ['key_high'],
        'up_natural': ['n_low'],
        'up_rally': ['n_low', 'rally_high'],
        'up_secondary': ['n_low', 'rally_high', 'secondary_low'],
        'up_break': ['n_low', 'break_low'],
        'down': ['key_low'],
        'down_natural': ['n_high'],
        'down_rally': ['n_high', 'rally_low'],
        'down_secondary': ['n_high', 'rally_low', 'secondary_high'],
        'down_break': ['n_high', 'break_high'],
    };

    // 上升/下跌体系的所有关键点（用于配置信息和图表）
    const UP_SYSTEM_ALL_KPS = [
        { kp: 'key_high',      label: '上升趋势' },
        { kp: 'n_low',         label: '自然回撤' },
        { kp: 'rally_high',    label: '回升' },
        { kp: 'secondary_low', label: '次级回撤' },
        { kp: 'break_low',     label: '上升破碎' },
    ];
    const DOWN_SYSTEM_ALL_KPS = [
        { kp: 'key_low',       label: '下跌趋势' },
        { kp: 'n_high',        label: '自然回升' },
        { kp: 'rally_low',     label: '回撤' },
        { kp: 'secondary_high', label: '次级回升' },
        { kp: 'break_high',    label: '下跌破碎' },
    ];

    const KP_LABELS = {
        'key_high': 'key_high', 'key_low': 'key_low',
        'n_low': 'n_low', 'n_high': 'n_high',
        'rally_high': 'rally_high', 'rally_low': 'rally_low',
        'secondary_low': 'secondary_low', 'secondary_high': 'secondary_high',
    };

    function renderConfigInfo(config, currentTrendCode) {
        const section = document.getElementById('configSection');
        const grid = document.getElementById('configGrid');

        if (!config || Object.keys(config).length === 0 || !config.config_date) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';

        const fmt = (v) => {
            if (v === null || v === undefined || v === '' || String(v) === 'nan') return '--';
            const n = parseFloat(v);
            return isNaN(n) ? '--' : n.toFixed(2);
        };

        const trendClass = config.config_trend && config.config_trend.startsWith('up') ? 'up' : 'down';

        // 确定当前趋势所属体系，展示体系中所有关键点
        const isUp = currentTrendCode && currentTrendCode.startsWith('up') && currentTrendCode !== 'down';
        const isDown = currentTrendCode && currentTrendCode.startsWith('down');
        const systemKps = isUp ? UP_SYSTEM_ALL_KPS : (isDown ? DOWN_SYSTEM_ALL_KPS : []);

        const items = [
            { label: 'config_date', value: config.config_date || '--' },
            { label: 'config_trend', value: config.config_trend || '--', trendClass: trendClass },
        ];

        // 展示当前体系的所有关键点
        for (const kpInfo of systemKps) {
            items.push({ label: kpInfo.label, value: fmt(config[kpInfo.kp]) });
        }

        grid.innerHTML = items.map(item => `
            <div class="config-item">
                <div class="config-label">${item.label}</div>
                <div class="config-value${item.trendClass ? ' ' + item.trendClass : ''}">${item.value}</div>
            </div>
        `).join('');
    }

    function renderMinuteSection(records) {
        const section = document.getElementById('minuteSection');
        const slider = document.getElementById('timeSlider');
        const timeRange = document.getElementById('sliderTimeRange');
        const countEl = document.getElementById('minuteCount');

        if (!records || records.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';
        countEl.textContent = `（共 ${records.length} 条）`;

        const total = records.length;
        slider.max = total - 1;
        slider.min = 0;
        slider.value = total - 1;

        const firstTime = formatMinuteTime(records[0].time);
        const lastTime = formatMinuteTime(records[records.length - 1].time);
        timeRange.textContent = `${firstTime} ～ ${lastTime}`;

        const KP_FROM_TREND = {
            'up': '上升趋势', 'up_natural': '自然回撤', 'up_rally': '回升',
            'up_secondary': '次级回撤', 'up_break': '上升破碎',
            'down': '下跌趋势', 'down_natural': '自然回升', 'down_rally': '回撤',
            'down_secondary': '次级回升', 'down_break': '下跌破碎',
        };

        function getTrendKp(rec, trend) {
            const kpName = KP_FROM_TREND[trend];
            if (!kpName) return '--';
            const v = rec[kpName];
            return (v != null && !isNaN(v)) ? v.toFixed(2) : '--';
        }

        function renderTable(showCount) {
            showCount = Math.min(Math.max(showCount, 10), total);
            const visible = records.slice(0, showCount);

            minuteTableBody.innerHTML = visible.map((rec, idx) => {
                const realIdx = total - showCount + idx;
                const isLast = realIdx === total - 1;
                const trend = rec.trend_code || '';
                const trendName = rec.trend_name || trend || '--';
                const kpValue = getTrendKp(rec, trend);
                const price = rec.close != null ? rec.close.toFixed(2) : '--';
                return '<tr class="' + (isLast ? 'tr-highlighted' : '') + '">' +
                    '<td class="td-time">' + formatMinuteTime(rec.time) + '</td>' +
                    '<td>' + trend + '</td>' +
                    '<td>' + trendName + '</td>' +
                    '<td>¥' + price + '</td>' +
                    '<td>' + kpValue + '</td></tr>';
            }).join('');

            const wrapper = document.getElementById('minuteTableWrapper');
            wrapper.scrollTop = wrapper.scrollHeight;
        }

        renderTable(total);
        slider.addEventListener('input', (e) => {
            renderTable(parseInt(e.target.value) + 1);
        });
    }


    function formatMinuteTime(t) {
        if (!t) return '--';
        try {
            const parts = t.split(' ');
            if (parts.length >= 2) {
                const d = parts[0];
                const time = parts[1].substring(0, 5);
                const dateParts = d.split('-');
                if (dateParts.length >= 3) {
                    return `${dateParts[1]}/${dateParts[2]} ${time}`;
                }
            }
        } catch (e) {}
        return t;
    }

    // Excel格式映射：中文列名 → 趋势代码
    const CHINESE_TO_TREND = {
        '上升趋势': 'up',
        '自然回撤': 'up_natural',
        '回升': 'up_rally',
        '次级回撤': 'up_secondary',
        '下跌趋势': 'down',
        '自然回升': 'down_natural',
        '回撤': 'down_rally',
        '次级回升': 'down_secondary',
    };

    function renderTrendsGrid(records, currentTrend) {
        const grid = document.getElementById('trendsGrid');

        if (!records || records.length === 0) {
            grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
                <div class="empty-icon">📊</div>
                <div>暂无趋势历史数据</div>
                <div style="font-size:12px;color:#9ca3af;margin-top:8px;">请先在主页搜索该股票以生成趋势历史</div>
            </div>`;
            return;
        }

        // 建立 time → {趋势代码: {record, kpName, kpValue}} 的映射
        // remark 字段存中文列名，从映射得到趋势代码
        const timeMap = {};
        for (const rec of records) {
            const t = rec.time;
            if (!timeMap[t]) timeMap[t] = {};
            const remark = rec.remark;
            const trendKey = CHINESE_TO_TREND[remark];
            if (trendKey) {
                const kpValue = rec[trendKey];
                timeMap[t][trendKey] = { record: rec, kpName: remark, kpValue: kpValue };
            }
        }

        const sortedTimes = Object.keys(timeMap).sort();
        if (sortedTimes.length === 0) {
            grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
                <div class="empty-icon">📊</div>
                <div>暂无趋势历史数据</div>
            </div>`;
            return;
        }

        let html = `<div class="trends-table-wrapper">
            <table class="trends-table">
                <thead>
                    <tr>
                        <th class="th-time">时间</th>
                        ${TREND_COLUMNS.map(col => `
                            <th class="th-trend th-${col.color}">
                                <div>${col.label}</div>
                                <div style="font-size:10px;font-weight:400;opacity:0.8;">${col.desc}</div>
                            </th>
                        `).join('')}
                    </tr>
                </thead>
                <tbody>`;

        for (const t of sortedTimes) {
            const trendData = timeMap[t];
            const isCurrentTimeRow = t === sortedTimes[sortedTimes.length - 1];

            html += `<tr class="tr-time-row${isCurrentTimeRow ? ' tr-current' : ''}">
                <td class="td-time">
                    <div class="cell-time">${formatDate(t)}</div>
                </td>`;

            for (const col of TREND_COLUMNS) {
                const cellData = trendData[col.key];
                if (cellData) {
                    const { record, kpName, kpValue } = cellData;
                    const kpLabel = KP_LABEL_MAP[kpName] || kpName;
                    const isCurrentTrend = currentTrend === col.key;
                    const currentClass = isCurrentTrend && isCurrentTimeRow ? ' cell-current' : '';
                    html += `<td class="td-trend td-${col.color}${currentClass}"
                                 onclick="showRecordDetailByTime('${t}', '${col.key}')">
                                <div class="cell-kp-label">${kpLabel}</div>
                                <div class="cell-kp-value">${kpValue != null ? kpValue.toFixed(2) : '--'}</div>
                            </td>`;
                } else {
                    html += `<td class="td-trend td-empty"></td>`;
                }
            }

            html += `</tr>`;
        }

        html += `</tbody></table></div>`;
        grid.innerHTML = html;
    }

    function getKpNameForTrend(trend) {
        const map = {
            'up': 'key_high',
            'up_natural': 'n_low',
            'up_rally': 'rally_high',
            'up_secondary': 'secondary_low',
            'up_break': 'key_low',
            'down': 'key_low',
            'down_natural': 'n_high',
            'down_rally': 'rally_low',
            'down_secondary': 'secondary_high',
            'down_break': 'key_high',
        };
        return map[trend] || null;
    }

    function formatDate(t) {
        if (!t) return '--';
        try {
            const parts = t.split(' ');
            if (parts.length >= 2) {
                const d = parts[0];
                const time = parts[1].substring(0, 5);
                const dateParts = d.split('-');
                if (dateParts.length >= 3) {
                    return `${dateParts[1]}/${dateParts[2]} ${time}`;
                }
            }
        } catch (e) {}
        return t;
    }

    // showRecordDetailByTime removed - trends grid section was old legacy content

    const KP_LABEL_MAP = {
        key_high: '关键高点', key_low: '关键低点',
        n_low: 'N值低点', n_high: 'N值高点',
        rally_high: '回升高点', rally_low: '回撤低点',
        secondary_low: '次级低点', secondary_high: '次级高点',
    };

    function renderEmpty(msg) {
        document.getElementById('stockHeader').innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📊</div>
                <div>${msg}</div>
            </div>
        `;
        document.getElementById('configSection').style.display = 'none';
        document.getElementById('minuteSection').style.display = 'none';
    }

    function showRecordDetail(index, trendKey) {
        // Excel格式：用 CHINESE_TO_TREND 映射来过滤
        const records = allRecords.filter(r => CHINESE_TO_TREND[r.remark] === trendKey);
        const rec = records[index];
        if (!rec) return;
        const col = TREND_COLUMNS.find(c => c.key === trendKey);
        showRecordDetailCore(rec, col, trendKey);
    }

    function showRecordDetailCore(rec, col, trendKey) {
        if (!rec) return;

        const colLabel = col ? col.label : (trendKey || '--');
        const colDesc = col ? col.desc : '';

        document.getElementById('modalTitle').textContent = `${rec.time} · ${colLabel}`;

        // Excel格式记录：关键点值存在 rec[trendKey] 字段中（如 rec["up"] = 32.06）
        const kpValue = rec[trendKey];
        const ratio = rec.ratio;

        const allKps = [
            ['时间', rec.time],
            ['趋势', rec.remark || '--'],
            ['点评', colDesc || '--'],
            ['关键点值', kpValue != null ? kpValue.toFixed(2) : '--'],
            ['比值', ratio != null ? ratio.toFixed(3) : '--'],
        ];

        document.getElementById('modalBody').innerHTML = allKps.map(([k, v]) => `
            <div class="modal-row">
                <span class="modal-label">${k}</span>
                <span class="modal-value">${v}</span>
            </div>
        `).join('');

        document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal(event) {
        if (event && event.target !== event.currentTarget) return;
        document.getElementById('modalOverlay').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });
    </script>
</body>
</html>
